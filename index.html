<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .container {
                padding: 60px 40px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: #0066cc;
        }

        .result-item.highlight {
            background: linear-gradient(135deg, #0066cc15 0%, #003d9915 100%);
            border-left-color: #0066cc;
        }

        .result-item.highlight .result-value {
            color: #0066cc;
            font-size: 42px;
        }

        @media (min-width: 768px) {
            .result-value {
                font-size: 48px;
            }

            .result-item.highlight .result-value {
                font-size: 56px;
            }
        }

        .details {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .details {
                font-size: 13px;
            }
        }

        .details p {
            margin-bottom: 8px;
        }

        .details strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle"></h1>
        <p class="subtitle" id="dateRange">Cargando fechas...</p>

        <div class="results show" id="results">
            <div class="result-item">
                <div class="result-label">Primer Periodo (1/1 - 30/6)</div>
                <div class="result-value" id="period1Expense">0,00 €</div>
            </div>

            <div class="result-item">
                <div class="result-label">Segundo Periodo (1/7 - 31/12)</div>
                <div class="result-value" id="period2Expense">0,00 €</div>
            </div>

            <div class="result-item highlight">
                <div class="result-label">Gasto Total Anual</div>
                <div class="result-value" id="totalExpense">0,00 €</div>
            </div>

            <div class="details">
                <p id="summary"></p>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuración de la aplicación
         * Single Responsibility: gestiona solo la configuración
         */
        const CONFIG = {
            DAILY_EXPENSE: 12.10,
            WORK_DAYS: [1, 2, 3, 4] // Lunes a jueves
        };

        /**
         * DateUtils: Utilidades para manejo de fechas
         * Single Responsibility Principle
         */
        class DateUtils {
            /**
             * Obtiene la fecha actual sin hora
             */
            static getCurrentDate() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return today;
            }

            /**
             * Crea una fecha desde string
             */
            static createDate(dateString) {
                const date = new Date(dateString);
                date.setHours(0, 0, 0, 0);
                return date;
            }

            /**
             * Verifica si una fecha es válida y futura
             */
            static isValidFutureDate(date) {
                const today = this.getCurrentDate();
                return date instanceof Date && !isNaN(date) && date >= today;
            }

            /**
             * Obtiene el año actual
             */
            static getCurrentYear() {
                return new Date().getFullYear();
            }

            /**
             * Calcula los periodos del año
             */
            static getYearPeriods(year) {
                return {
                    period1: {
                        start: this.createDate(`${year}-01-01`),
                        end: this.createDate(`${year}-06-30`)
                    },
                    period2: {
                        start: this.createDate(`${year}-07-01`),
                        end: this.createDate(`${year}-12-31`)
                    }
                };
            }
        }

        /**
         * ExpenseCalculator: Encargado solo de cálculos
         * Single Responsibility Principle
         */
        class ExpenseCalculator {
            constructor(config) {
                this.config = config;
            }

            /**
             * Calcula el número total de días entre dos fechas (inclusive)
             */
            calculateTotalDays(startDate, endDate) {
                const timeDiff = endDate - startDate;
                return Math.floor(timeDiff / (1000 * 60 * 60 * 24)) + 1;
            }

            /**
             * Calcula los días de gasto en los días de la semana especificados
             */
            calculateExpenseDays(startDate, endDate) {
                let expenseDays = 0;
                const currentDate = new Date(startDate);
                currentDate.setHours(0, 0, 0, 0);
                const endDateNormalized = new Date(endDate);
                endDateNormalized.setHours(0, 0, 0, 0);

                while (currentDate <= endDateNormalized) {
                    const dayOfWeek = currentDate.getDay();
                    if (this.config.WORK_DAYS.includes(dayOfWeek)) {
                        expenseDays++;
                    }
                    currentDate.setDate(currentDate.getDate() + 1);
                }

                return expenseDays;
            }

            /**
             * Calcula el gasto total
             */
            calculateTotalExpense(expenseDays, dailyExpense) {
                return expenseDays * dailyExpense;
            }

            /**
             * Ejecuta todos los cálculos y retorna los resultados
             */
            execute(startDate, endDate, dailyExpense) {
                const expenseDays = this.calculateExpenseDays(startDate, endDate);
                return {
                    totalDays: this.calculateTotalDays(startDate, endDate),
                    expenseDays: expenseDays,
                    totalExpense: this.calculateTotalExpense(expenseDays, dailyExpense)
                };
            }
        }

        /**
         * DateFormatter: Encargado solo de formatear fechas
         * Single Responsibility Principle
         */
        class DateFormatter {
            static format(date, locale = 'es-ES') {
                return date.toLocaleDateString(locale);
            }
        }

        /**
         * NumberFormatter: Encargado solo de formatear números
         * Single Responsibility Principle
         */
        class NumberFormatter {
            static formatCurrency(amount, locale = 'es-ES') {
                return amount.toLocaleString(locale, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }
        }

        /**
         * SummaryBuilder: Construye el resumen del gasto
         * Single Responsibility Principle
         */
        class SummaryBuilder {
            static build(period1Days, period2Days, dailyExpense, period1Expense, period2Expense, totalExpense) {
                const dailyExpenseStr = NumberFormatter.formatCurrency(dailyExpense);
                const period1ExpenseStr = NumberFormatter.formatCurrency(period1Expense);
                const period2ExpenseStr = NumberFormatter.formatCurrency(period2Expense);
                
                return `<strong>Primer Periodo:</strong> ${period1Days} días de trabajo × ${dailyExpenseStr} € = ${period1ExpenseStr} €<br>` +
                       `<strong>Segundo Periodo:</strong> ${period2Days} días de trabajo × ${dailyExpenseStr} € = ${period2ExpenseStr} €<br>` +
                       `Gastando de <strong>lunes a jueves</strong>, <strong>${dailyExpenseStr} €</strong> al día.`;
            }
        }

        /**
         * UIUpdater: Encargado solo de actualizar la interfaz
         * Single Responsibility Principle
         */
        class UIUpdater {
            static updateExpenseValue(elementId, formattedExpense) {
                document.getElementById(elementId).textContent = formattedExpense + ' €';
            }

            static updatePeriodExpenses(period1Expense, period2Expense, totalExpense) {
                this.updateExpenseValue('period1Expense', NumberFormatter.formatCurrency(period1Expense));
                this.updateExpenseValue('period2Expense', NumberFormatter.formatCurrency(period2Expense));
                this.updateExpenseValue('totalExpense', NumberFormatter.formatCurrency(totalExpense));
            }

            static updateSummary(elementId, summary) {
                document.getElementById(elementId).innerHTML = summary;
            }

            static updateDateRange(elementId, year) {
                document.getElementById(elementId).textContent = `Año ${year}`;
            }

            static updateMainTitle(elementId, year) {
                document.getElementById(elementId).textContent = `💰 Gastos ${year}`;
            }
        }

        /**
         * ExpenseApp: Orquestador principal (Facade Pattern)
         * Dependency Inversion Principle: depende de abstracciones
         */
        class ExpenseApp {
            constructor(calculator, config) {
                this.calculator = calculator;
                this.config = config;
            }

            /**
             * Método principal que orquesta el flujo de la aplicación
             */
            run() {
                const year = DateUtils.getCurrentYear();
                const periods = DateUtils.getYearPeriods(year);
                const dailyExpense = this.config.DAILY_EXPENSE;

                // Calcular gastos para el primer periodo
                const period1Results = this.calculator.execute(
                    periods.period1.start,
                    periods.period1.end,
                    dailyExpense
                );

                // Calcular gastos para el segundo periodo
                const period2Results = this.calculator.execute(
                    periods.period2.start,
                    periods.period2.end,
                    dailyExpense
                );

                // Calcular total anual
                const totalExpense = period1Results.totalExpense + period2Results.totalExpense;

                // Formatear y actualizar UI
                const summary = SummaryBuilder.build(
                    period1Results.expenseDays,
                    period2Results.expenseDays,
                    dailyExpense,
                    period1Results.totalExpense,
                    period2Results.totalExpense,
                    totalExpense
                );

                // Actualizar UI
                UIUpdater.updateMainTitle('mainTitle', year);
                UIUpdater.updateDateRange('dateRange', year);
                UIUpdater.updatePeriodExpenses(
                    period1Results.totalExpense,
                    period2Results.totalExpense,
                    totalExpense
                );
                UIUpdater.updateSummary('summary', summary);
            }

            /**
             * Programa actualizaciones automáticas
             */
            scheduleUpdates() {
                // Actualizar cada minuto para capturar cambios de día
                setInterval(() => {
                    this.run();
                }, 60000);

                // Actualizar inmediatamente al cambio de día
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(0, 0, 0, 0);
                
                const msUntilMidnight = tomorrow.getTime() - now.getTime();
                
                setTimeout(() => {
                    this.run();
                    // Después del primer cambio de día, actualizar cada 24 horas
                    setInterval(() => {
                        this.run();
                    }, 24 * 60 * 60 * 1000);
                }, msUntilMidnight);
            }
        }

        /**
         * Inicialización de la aplicación
         */
        window.addEventListener('load', () => {
            const calculator = new ExpenseCalculator(CONFIG);
            const app = new ExpenseApp(calculator, CONFIG);
            
            // Ejecutar primera vez
            app.run();
            
            // Programar actualizaciones automáticas
            app.scheduleUpdates();
        });
    </script>
</body>
</html>
