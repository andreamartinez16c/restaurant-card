<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .container {
                padding: 60px 40px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: #0066cc;
        }

        .result-item.highlight {
            background: linear-gradient(135deg, #0066cc15 0%, #003d9915 100%);
            border-left-color: #0066cc;
        }

        .result-item.highlight .result-value {
            color: #0066cc;
            font-size: 42px;
        }

        @media (min-width: 768px) {
            .result-value {
                font-size: 48px;
            }

            .result-item.highlight .result-value {
                font-size: 56px;
            }
        }

        .details {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .details {
                font-size: 13px;
            }
        }

        .details p {
            margin-bottom: 8px;
        }

        .details strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle"></h1>
        <p class="subtitle" id="dateRange">Cargando fechas...</p>

        <div class="results show" id="results">
            <div class="result-item highlight">
                <div class="result-label">Primer Periodo</div>
                <div class="result-value" id="period1Remaining">0,00 €</div>
            </div>

            <div class="details">
                <p id="period1Summary"></p>
            </div>

            <div class="result-item highlight">
                <div class="result-label">Segundo Periodo</div>
                <div class="result-value" id="period2Remaining">0,00 €</div>
            </div>

            <div class="details">
                <p id="period2Summary"></p>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuración de la aplicación
         * Single Responsibility: gestiona solo la configuración
         */
        const CONFIG = {
            DAILY_EXPENSE: 12.10,
            WORK_DAYS: [1, 2, 3, 4], // Lunes a jueves
            PERIODS: [
                {
                    name: 'Primer Periodo',
                    startAmount: 1089,
                    startDate: '2026-01-01',
                    endDate: '2026-06-30'
                },
                {
                    name: 'Segundo Periodo',
                    startAmount: 1125,
                    startDate: '2026-07-01',
                    endDate: '2026-12-31'
                }
            ]
        };

        /**
         * DateUtils: Utilidades para manejo de fechas
         * Single Responsibility Principle
         */
        class DateUtils {
            /**
             * Obtiene la fecha actual sin hora
             */
            static getCurrentDate() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return today;
            }

            /**
             * Crea una fecha desde string
             */
            static createDate(dateString) {
                const date = new Date(dateString);
                date.setHours(0, 0, 0, 0);
                return date;
            }

            /**
             * Verifica si una fecha es válida y futura
             */
            static isValidFutureDate(date) {
                const today = this.getCurrentDate();
                return date instanceof Date && !isNaN(date) && date >= today;
            }
        }

        /**
         * ExpenseCalculator: Encargado solo de cálculos
         * Single Responsibility Principle
         */
        class ExpenseCalculator {
            constructor(config) {
                this.config = config;
            }

            /**
             * Calcula el número total de días entre dos fechas (inclusive)
             */
            calculateTotalDays(startDate, endDate) {
                const timeDiff = endDate - startDate;
                return Math.floor(timeDiff / (1000 * 60 * 60 * 24)) + 1;
            }

            /**
             * Calcula los días de gasto en los días de la semana especificados
             */
            calculateExpenseDays(startDate, endDate) {
                let expenseDays = 0;
                const currentDate = new Date(startDate);
                currentDate.setHours(0, 0, 0, 0);
                const endDateNormalized = new Date(endDate);
                endDateNormalized.setHours(0, 0, 0, 0);

                while (currentDate <= endDateNormalized) {
                    const dayOfWeek = currentDate.getDay();
                    if (this.config.WORK_DAYS.includes(dayOfWeek)) {
                        expenseDays++;
                    }
                    currentDate.setDate(currentDate.getDate() + 1);
                }

                return expenseDays;
            }

            /**
             * Calcula el gasto total
             */
            calculateTotalExpense(expenseDays, dailyExpense) {
                return expenseDays * dailyExpense;
            }

            /**
             * Ejecuta todos los cálculos y retorna los resultados
             */
            execute(startDate, endDate, dailyExpense) {
                return {
                    totalDays: this.calculateTotalDays(startDate, endDate),
                    expenseDays: this.calculateExpenseDays(startDate, endDate),
                    totalExpense: this.calculateTotalExpense(
                        this.calculateExpenseDays(startDate, endDate),
                        dailyExpense
                    )
                };
            }

            /**
             * Calcula el saldo restante para un periodo
             */
            calculatePeriodRemaining(period, currentDate, dailyExpense) {
                const periodStart = DateUtils.createDate(period.startDate);
                const periodEnd = DateUtils.createDate(period.endDate);
                
                // Si la fecha actual es antes del periodo, no se ha gastado nada
                if (currentDate < periodStart) {
                    return {
                        remaining: period.startAmount,
                        expenseDays: 0,
                        totalExpense: 0,
                        status: 'future'
                    };
                }
                
                // Si la fecha actual es después del periodo, calcular todo el periodo
                if (currentDate > periodEnd) {
                    const expenseDays = this.calculateExpenseDays(periodStart, periodEnd);
                    const totalExpense = this.calculateTotalExpense(expenseDays, dailyExpense);
                    return {
                        remaining: period.startAmount - totalExpense,
                        expenseDays: expenseDays,
                        totalExpense: totalExpense,
                        status: 'completed'
                    };
                }
                
                // Si estamos dentro del periodo, calcular hasta hoy
                const expenseDays = this.calculateExpenseDays(periodStart, currentDate);
                const totalExpense = this.calculateTotalExpense(expenseDays, dailyExpense);
                
                return {
                    remaining: period.startAmount - totalExpense,
                    expenseDays: expenseDays,
                    totalExpense: totalExpense,
                    status: 'active'
                };
            }
        }

        /**
         * DateFormatter: Encargado solo de formatear fechas
         * Single Responsibility Principle
         */
        class DateFormatter {
            static format(date, locale = 'es-ES') {
                return date.toLocaleDateString(locale);
            }
        }

        /**
         * NumberFormatter: Encargado solo de formatear números
         * Single Responsibility Principle
         */
        class NumberFormatter {
            static formatCurrency(amount, locale = 'es-ES') {
                return amount.toLocaleString(locale, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }
        }

        /**
         * SummaryBuilder: Construye el resumen del gasto
         * Single Responsibility Principle
         */
        class SummaryBuilder {
            static build(expenseDays, dailyExpense, formattedExpense) {
                const dailyExpenseStr = NumberFormatter.formatCurrency(dailyExpense);
                return `De <strong>lunes a jueves</strong>, gastando <strong>${dailyExpenseStr} €</strong> al día durante <strong>${expenseDays} días</strong>.`;
            }

            static buildPeriodSummary(period, result, dailyExpense) {
                const dailyExpenseStr = NumberFormatter.formatCurrency(dailyExpense);
                const startAmount = NumberFormatter.formatCurrency(period.startAmount);
                const totalExpense = NumberFormatter.formatCurrency(result.totalExpense);
                
                if (result.status === 'future') {
                    return `<strong>Periodo futuro.</strong> Inicia con <strong>${startAmount} €</strong>.`;
                }
                
                return `Inicia con <strong>${startAmount} €</strong>. Gastado <strong>${totalExpense} €</strong> en <strong>${result.expenseDays} días</strong> (${dailyExpenseStr} € al día, lunes a jueves).`;
            }
        }

        /**
         * UIUpdater: Encargado solo de actualizar la interfaz
         * Single Responsibility Principle
         */
        class UIUpdater {
            static updateExpenseValue(elementId, formattedExpense) {
                document.getElementById(elementId).textContent = formattedExpense + ' €';
            }

            static updateSummary(elementId, summary) {
                document.getElementById(elementId).innerHTML = summary;
            }

            static updateDateRange(elementId, startDate, endDate) {
                const formattedStart = DateFormatter.format(startDate);
                const formattedEnd = DateFormatter.format(endDate);
                document.getElementById(elementId).textContent = `${formattedStart} - ${formattedEnd}`;
            }

            static updateMainTitle(elementId, startDate) {
                document.getElementById(elementId).textContent = `💰 Calculadora de Gastos`;
            }

            static updatePeriod(periodNum, result, period, dailyExpense) {
                const remainingFormatted = NumberFormatter.formatCurrency(result.remaining);
                const summary = SummaryBuilder.buildPeriodSummary(period, result, dailyExpense);
                
                this.updateExpenseValue(`period${periodNum}Remaining`, remainingFormatted);
                this.updateSummary(`period${periodNum}Summary`, summary);
            }
        }

        /**
         * ExpenseApp: Orquestador principal (Facade Pattern)
         * Dependency Inversion Principle: depende de abstracciones
         */
        class ExpenseApp {
            constructor(calculator, config) {
                this.calculator = calculator;
                this.config = config;
            }

            /**
             * Método principal que orquesta el flujo de la aplicación
             */
            run() {
                const currentDate = DateUtils.getCurrentDate();
                const dailyExpense = this.config.DAILY_EXPENSE;

                // Actualizar título
                UIUpdater.updateMainTitle('mainTitle', currentDate);

                // Calcular y mostrar fecha general del rango
                if (this.config.PERIODS && this.config.PERIODS.length > 0) {
                    const firstPeriod = this.config.PERIODS[0];
                    const lastPeriod = this.config.PERIODS[this.config.PERIODS.length - 1];
                    const startDate = DateUtils.createDate(firstPeriod.startDate);
                    const endDate = DateUtils.createDate(lastPeriod.endDate);
                    UIUpdater.updateDateRange('dateRange', startDate, endDate);

                    // Procesar cada periodo
                    this.config.PERIODS.forEach((period, index) => {
                        const result = this.calculator.calculatePeriodRemaining(
                            period,
                            currentDate,
                            dailyExpense
                        );
                        UIUpdater.updatePeriod(index + 1, result, period, dailyExpense);
                    });
                }
            }

            /**
             * Programa actualizaciones automáticas
             */
            scheduleUpdates() {
                // Actualizar cada minuto para capturar cambios de día
                setInterval(() => {
                    this.run();
                }, 60000);

                // Actualizar inmediatamente al cambio de día
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(0, 0, 0, 0);
                
                const msUntilMidnight = tomorrow.getTime() - now.getTime();
                
                setTimeout(() => {
                    this.run();
                    // Después del primer cambio de día, actualizar cada 24 horas
                    setInterval(() => {
                        this.run();
                    }, 24 * 60 * 60 * 1000);
                }, msUntilMidnight);
            }
        }

        /**
         * Inicialización de la aplicación
         */
        window.addEventListener('load', () => {
            const calculator = new ExpenseCalculator(CONFIG);
            const app = new ExpenseApp(calculator, CONFIG);
            
            // Ejecutar primera vez
            app.run();
            
            // Programar actualizaciones automáticas
            app.scheduleUpdates();
        });
    </script>
</body>
</html>
